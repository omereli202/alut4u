<style>

<p class="font-body text-body text-on-surface-variant text-center">אין חיבור לשרת.</p>
<button class="font-subheading text-subheading text-primary hover:text-primary-container hover:bg-surface-container-low px-4 py-2 rounded-lg transition-colors active:scale-95 flex items-center gap-2" onclick="retryConnection()">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">refresh</span>
                    נסה שוב
                </button>
</div>
</div>
</main>
<script>
        // Simple state management for demonstration purposes
        const loadingState = document.getElementById('loading-state');
        const errorState = document.getElementById('error-state');

        // Simulate a network failure after 3 seconds for demonstration
        setTimeout(() => {
            showError();
        }, 3000);

        function showError() {
            loadingState.classList.remove('opacity-100', 'z-10');
            loadingState.classList.add('opacity-0', 'pointer-events-none', 'z-0');
            
            errorState.classList.remove('opacity-0', 'pointer-events-none', 'z-0');
            errorState.classList.add('opacity-100', 'z-10');
        }

        function showLoading() {
            errorState.classList.remove('opacity-100', 'z-10');
            errorState.classList.add('opacity-0', 'pointer-events-none', 'z-0');
            
            loadingState.classList.remove('opacity-0', 'pointer-events-none', 'z-0');
            loadingState.classList.add('opacity-100', 'z-10');
        }

        function retryConnection() {
            showLoading();
            // Re-simulate failure or success
            setTimeout(() => {
                 showError(); // Or transition to next screen on success
            }, 2000);
        }
    </script>
