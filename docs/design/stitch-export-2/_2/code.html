<!DOCTYPE html>

<body class="bg-bg text-text font-body min-h-screen flex flex-col antialiased selection:bg-primary-container selection:text-on-primary-container">
<!-- Top App Bar -->
<header class="w-full bg-surface shadow-sm sticky top-0 z-50 flex items-center justify-between px-6 h-24">
<!-- Right side (Start in RTL) - Exit Action -->
<button class="w-16 h-16 flex items-center justify-center rounded-2xl bg-surface-variant hover:bg-surface-container-high active:scale-95 transition-all text-on-surface-variant focus:outline-none focus:ring-4 focus:ring-focus focus:ring-offset-2">
<span class="material-symbols-outlined" style="font-size: 36px;">close</span>
</button>
<!-- Center - Title -->
<h1 class="font-display-user text-display-user text-primary text-center flex-1 px-4 truncate">
            קריאה וכתיבה — נועה
        </h1>
<!-- Left side (End in RTL) - Token Badge -->
<div class="flex items-center gap-2 bg-tertiary-fixed text-on-tertiary-fixed px-6 py-3 rounded-full shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 32px; color: #E6A23C;">star</span>
<span class="font-subheading text-subheading font-bold">14</span>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 w-full max-w-5xl mx-auto px-6 flex flex-col gap-8 pb-32 pt-8">
<!-- Tabs -->
<div class="flex bg-surface-container-low p-2 rounded-[2rem] gap-2 shadow-inner">
<!-- Selected Tab: Reading -->
<button class="flex-1 py-6 bg-primary text-on-primary rounded-[1.5rem] font-subheading text-subheading shadow-md active:scale-98 transition-transform focus:outline-none focus:ring-4 focus:ring-focus">
                קריאה
            </button>
<!-- Unselected Tab: Writing -->
<button class="flex-1 py-6 text-on-surface-variant hover:bg-surface-variant rounded-[1.5rem] font-subheading text-subheading active:scale-98 transition-transform focus:outline-none focus:ring-4 focus:ring-focus">
                כתיבה
            </button>
</div>
<!-- List Container -->
<div class="flex flex-col gap-6 w-full">
<!-- Lesson Tile 1 -->
<button class="w-full bg-surface p-8 rounded-[2.5rem] shadow-sm hover:shadow-md active:scale-98 transition-all flex items-center gap-8 text-start border-2 border-transparent focus:border-focus focus:outline-none"><div class="bg-secondary-container text-on-secondary-container px-6 py-2 rounded-full font-subheading text-subheading whitespace-nowrap flex items-center justify-center">
                    רמת קריאה 1: מילים
                </div>
<div class="flex-1 font-heading-caregiver text-heading-caregiver text-text pe-4 border-e-2 border-border border-dashed">
                    הכרת האות א'
                </div>
<div class="w-20 h-20 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center ms-auto shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 40px;">play_arrow</span>
</div><div class="w-12 h-12 flex items-center justify-center rounded-full bg-success text-on-primary shadow-sm ms-4">
<span class="material-symbols-outlined" style="font-size: 24px; font-weight: bold;">check</span>
</div></button>
<!-- Lesson Tile 2 -->
<button class="w-full bg-surface p-8 rounded-[2.5rem] shadow-sm hover:shadow-md active:scale-98 transition-all flex items-center gap-8 text-start border-2 border-transparent focus:border-focus focus:outline-none"><div class="bg-secondary-container text-on-secondary-container px-6 py-2 rounded-full font-subheading text-subheading whitespace-nowrap flex items-center justify-center">
                    רמת קריאה 2: משפטים קצרים
                </div>
<div class="flex-1 font-heading-caregiver text-heading-caregiver text-text pe-4 border-e-2 border-border border-dashed">
                    מילים ראשונות עם א'
                </div>
<div class="w-20 h-20 rounded-full bg-primary-container text-on-primary-container flex items-center justify-center ms-auto shadow-sm">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 40px;">play_arrow</span>
</div><div class="w-12 h-12 flex items-center justify-center rounded-full bg-success text-on-primary shadow-sm ms-4">
<span class="material-symbols-outlined" style="font-size: 24px; font-weight: bold;">check</span>
</div></button>
<!-- Lesson Tile 3 -->
<button class="w-full bg-surface p-8 rounded-[2.5rem] shadow-sm hover:shadow-md active:scale-98 transition-all flex items-center gap-8 text-start border-2 border-transparent focus:border-focus focus:outline-none opacity-80"><div class="bg-secondary-container text-on-secondary-container px-6 py-2 rounded-full font-subheading text-subheading whitespace-nowrap flex items-center justify-center">
                    רמת קריאה 3: סיפורים קצרים
                </div>
<div class="flex-1 font-heading-caregiver text-heading-caregiver text-text pe-4 border-e-2 border-border border-dashed">
                    הכרת האות ב'
                </div>
<div class="w-20 h-20 rounded-full bg-surface-variant text-on-surface-variant flex items-center justify-center ms-auto">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1; font-size: 32px;">lock</span>
</div><div class="w-12 h-12 flex items-center justify-center rounded-full bg-surface-container-highest text-outline-variant ms-4">
<span class="material-symbols-outlined" style="font-size: 24px;">check</span>
</div></button>
</div>
</main>
</body></html>
