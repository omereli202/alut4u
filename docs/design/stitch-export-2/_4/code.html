<!DOCTYPE html>

<html dir="rtl" lang="he"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Writing Exercise - User Mode</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "text": "#2D3436",
                        "on-surface": "#1a1c1f",
                        "surface-container-low": "#f4f3f7",
                        "inverse-primary": "#a6c8fd",
                        "surface-variant": "#e2e2e6",
                        "inverse-on-surface": "#f1f0f5",
                        "tertiary": "#79550e",
                        "inverse-surface": "#2f3034",
                        "outline": "#737780",
                        "on-primary-container": "#fdfcff",
                        "secondary": "#3e6658",
                        "tertiary-container": "#956e27",
                        "on-tertiary": "#ffffff",
                        "outline-variant": "#c3c6d0",
                        "on-tertiary-fixed-variant": "#604100",
                        "text-muted": "#636E72",
                        "surface-container": "#eeedf2",
                        "surface-dim": "#dad9de",
                        "on-surface-variant": "#43474f",
                        "on-tertiary-fixed": "#281900",
                        "surface-bright": "#faf9fd",
                        "on-primary-fixed": "#001c3a",
                        "on-error": "#ffffff",
                        "primary-fixed": "#d4e3ff",
                        "border": "#DCDFE6",
                        "surface": "#FFFFFF",
                        "surface-container-highest": "#e2e2e6",
                        "on-secondary-fixed": "#002117",
                        "bg": "#F7F9F9",
                        "on-primary-fixed-variant": "#234875",
                        "on-background": "#1a1c1f",
                        "secondary-fixed": "#c0ecda",
                        "error": "#ba1a1a",
                        "warning": "#E6A23C",
                        "secondary-container": "#c0ecda",
                        "on-primary": "#ffffff",
                        "on-tertiary-container": "#fffbff",
                        "danger": "#D66853",
                        "on-secondary-container": "#446c5e",
                        "primary-container": "#5476a6",
                        "tertiary-fixed-dim": "#efbf70",
                        "error-container": "#ffdad6",
                        "on-secondary": "#ffffff",
                        "surface-tint": "#3d608e",
                        "secondary-fixed-dim": "#a5d0be",
                        "primary-fixed-dim": "#a6c8fd",
                        "on-error-container": "#93000a",
                        "success": "#7FB069",
                        "focus": "#4A90E2",
                        "on-secondary-fixed-variant": "#264e41",
                        "primary": "#3a5d8b",
                        "surface-container-lowest": "#ffffff",
                        "background": "#faf9fd",
                        "surface-container-high": "#e8e8ec",
                        "tertiary-fixed": "#ffdeac"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "4": "1rem",
                        "1": "0.25rem",
                        "12": "3rem",
                        "6": "1.5rem",
                        "3": "0.75rem",
                        "2": "0.5rem",
                        "8": "2rem",
                        "16": "4rem",
                        "24": "6rem"
                    },
                    "fontFamily": {
                        "subheading": ["Rubik"],
                        "caption": ["Rubik"],
                        "body": ["Rubik"],
                        "display-user": ["Rubik"],
                        "heading-caregiver": ["Rubik"]
                    },
                    "fontSize": {
                        "subheading": ["1.4rem", { "lineHeight": "1.3", "fontWeight": "500" }],
                        "caption": ["0.9rem", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "body": ["1.125rem", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "display-user": ["2.6rem", { "lineHeight": "1.15", "fontWeight": "500" }],
                        "heading-caregiver": ["1.9rem", { "lineHeight": "1.2", "fontWeight": "500" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Rubik', sans-serif; }
        /* Focus styles for user mode inputs */
        input:focus { outline: none; box-shadow: 0 0 0 3px var(--tw-colors-focus); }
        .tile-press:active { transform: scale(0.98); transition: transform 0.1s ease; }
    </style>
</head>
<body class="bg-surface-container-low min-h-screen text-on-surface" data-mode="user">
<!-- TopAppBar JSON execution (User Mode style, adapted for RTL landscape writing flow) -->
<!-- Suppressing side nav as per semantic shell mandate (linear flow) -->
<header class="bg-surface-bright dark:bg-surface-container-lowest text-secondary dark:text-secondary-fixed-dim font-display-user text-display-user docked full-width top-0 bg-surface-container-highest dark:bg-surface-dim flat no shadows hover:opacity-80 flex justify-between items-center w-full px-8 h-20 shadow-sm rounded-b-lg">
<div class="flex items-center gap-4">
<!-- Breadcrumbs / Title -->
<span class="font-subheading text-subheading text-on-surface-variant flex items-center gap-2">
                קריאה וכתיבה
                <span class="material-symbols-outlined text-outline" style="font-variation-settings: 'FILL' 0;">chevron_left</span>
<span class="text-secondary font-bold">תרגול כתיבה</span>
</span>
</div>
<!-- Back action on the right for RTL -->
<button aria-label="חזרה" class="flex items-center gap-2 px-6 py-3 bg-surface-variant hover:bg-surface-container-high rounded-full tile-press transition-colors text-primary">
<span class="font-subheading text-subheading">חזרה</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 0;">arrow_forward</span>
</button>
</header>
<main class="container mx-auto px-8 py-12 flex flex-col items-center justify-center max-w-4xl" id="main-exercise-area">
<!-- Exercise Container -->
<div class="bg-surface shadow-sm rounded-xl p-16 w-full flex flex-col items-center text-center border border-outline-variant/30" id="exercise-content">
<!-- Prompt -->
<div class="flex items-center justify-center gap-6 mb-12">
<h1 class="font-display-user text-display-user text-on-surface">
                    כתבו את המילה: <span class="text-primary font-bold">שלום</span>
</h1>
<button aria-label="השמע מילה" class="w-16 h-16 bg-primary-container text-on-primary-container rounded-full flex items-center justify-center hover:bg-primary/20 tile-press shadow-sm transition-colors">
<span class="material-symbols-outlined text-4xl" style="font-variation-settings: 'FILL' 1;">volume_up</span>
</button>
</div>
<!-- Input Field -->
<div class="w-full max-w-2xl mb-12 relative">
<input aria-label="הזן טקסט כאן" autocomplete="off" class="w-full text-center font-display-user text-display-user py-8 px-6 bg-surface-bright rounded-2xl shadow-sm border-0 text-on-surface placeholder:text-outline-variant focus:ring-0 focus:shadow-[0_0_0_3px_#4A90E2] transition-shadow" dir="rtl" placeholder="..." type="text"/>
</div>
<!-- Primary Action -->
<button class="bg-primary text-on-primary font-subheading text-subheading px-12 py-6 rounded-xl min-w-[240px] h-[72px] tile-press shadow-md hover:opacity-90 transition-opacity" id="check-btn">
                בדיקה
            </button>
</div>
<!-- Feedback Overlays (Hidden by default, shown via JS demo) -->
<div class="hidden w-full" id="success-feedback">
<div class="bg-surface shadow-md rounded-xl p-12 w-full flex flex-col items-center text-center border-2 border-success/30 relative overflow-hidden mt-8">
<div class="absolute inset-0 bg-success/5 pointer-events-none"></div>
<div class="w-24 h-24 bg-success/20 text-success rounded-full flex items-center justify-center mb-6 shadow-sm">
<span class="material-symbols-outlined text-6xl" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<h2 class="font-display-user text-display-user text-on-surface mb-2">נכון מאוד!</h2>
<p class="font-subheading text-subheading text-success mb-12 flex items-center gap-2">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">toll</span>
                    +1 אסימון
                </p>
<div class="flex gap-6 w-full justify-center">
<button class="bg-surface-variant text-on-surface-variant font-subheading text-subheading px-8 py-5 rounded-xl tile-press hover:bg-surface-container-high transition-colors">
                        חזרה לרשימה
                    </button>
<button class="bg-primary text-on-primary font-subheading text-subheading px-8 py-5 rounded-xl tile-press hover:opacity-90 shadow-sm transition-opacity">
                        תרגיל הבא
                    </button>
</div>
</div>
</div>
<div class="hidden w-full" id="try-again-feedback">
<div class="bg-surface shadow-sm rounded-xl p-12 w-full flex flex-col items-center text-center border border-outline-variant mt-8">
<h2 class="font-subheading text-subheading text-on-surface-variant mb-4">כמעט! המילה הנכונה היא: <span class="font-bold text-on-surface">שלום</span></h2>
<button class="bg-secondary-container text-on-secondary-container font-subheading text-subheading px-8 py-4 rounded-xl tile-press hover:bg-secondary/20 transition-colors mt-4">
                    נסה שוב
                </button>
</div>
</div>
</main>
<script>
        // Simple demonstration script to show states
        const checkBtn = document.getElementById('check-btn');
        const inputField = document.querySelector('input');
        const successFeedback = document.getElementById('success-feedback');
        const tryAgainFeedback = document.getElementById('try-again-feedback');
        const exerciseContent = document.getElementById('exercise-content');

        checkBtn.addEventListener('click', () => {
            const val = inputField.value.trim();
            if (val === 'שלום') {
                exerciseContent.classList.add('hidden');
                successFeedback.classList.remove('hidden');
                tryAgainFeedback.classList.add('hidden');
            } else if (val.length > 0) {
                // Show gentle try again without hiding main input entirely, just appending below
                tryAgainFeedback.classList.remove('hidden');
                successFeedback.classList.add('hidden');
            }
        });

        // Reset demo on Try Again
        const tryAgainBtn = tryAgainFeedback.querySelector('button');
        tryAgainBtn.addEventListener('click', () => {
            inputField.value = '';
            inputField.focus();
            tryAgainFeedback.classList.add('hidden');
        });
    </script>
</body></html>
