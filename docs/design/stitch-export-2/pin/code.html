<style>
        .pin-input:focus-within {
            box-shadow: 0 0 0 3px var(--tw-colors-focus);

<body class="bg-background text-on-background min-h-screen font-body flex items-center justify-center p-4 relative" data-mode="user">
<!-- Mock Background Content (Dimmed) -->
<div class="absolute inset-0 bg-surface-variant/40 flex flex-col items-center justify-center blur-sm p-8 z-0">
<div class="bg-surface rounded-xl shadow-sm p-12 max-w-2xl w-full text-center">
<h1 class="font-display-user text-display-user text-primary mb-8">תרגיל קריאה</h1>
<div class="flex gap-4 justify-center flex-wrap">
<div class="w-24 h-24 bg-surface-container rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-4xl text-primary" data-icon="book" data-weight="fill" style="font-variation-settings: 'FILL' 1;">book</span>
</div>
<div class="w-24 h-24 bg-surface-container rounded-lg flex items-center justify-center">
<span class="material-symbols-outlined text-4xl text-primary" data-icon="edit" data-weight="fill" style="font-variation-settings: 'FILL' 1;">edit</span>
</div>
</div>
</div>
</div>
<!-- Inline PIN Gate Overlay -->
<div class="relative z-10 bg-surface rounded-xl shadow-md p-8 max-w-sm w-full border border-surface-variant flex flex-col items-center text-center">
<div class="w-16 h-16 bg-primary-container rounded-full flex items-center justify-center mb-6">
<span class="material-symbols-outlined text-on-primary-container text-3xl" data-icon="lock" data-weight="fill" style="font-variation-settings: 'FILL' 1;">lock</span>
</div>
<h2 class="font-heading-caregiver text-heading-caregiver text-primary mb-2">אישור מטפל</h2>
<p class="font-body text-body text-on-surface-variant mb-8">מטפל/ת, הזינו קוד כדי לאשר את ביצוע המשימה:</p>
<!-- PIN Input Container -->
<div class="flex gap-4 mb-8 justify-center direction-ltr" dir="ltr">
<!-- Simulating 4 digit input fields for high visual feedback, common in such patterns -->
<input aria-label="Digit 1" class="w-16 h-16 text-center text-3xl rounded-lg border-2 border-outline bg-surface-container-lowest text-on-surface focus:border-focus focus:ring-2 focus:ring-focus focus:outline-none transition-all duration-200" maxlength="1" type="password"/>
<input aria-label="Digit 2" class="w-16 h-16 text-center text-3xl rounded-lg border-2 border-outline bg-surface-container-lowest text-on-surface focus:border-focus focus:ring-2 focus:ring-focus focus:outline-none transition-all duration-200" maxlength="1" type="password"/>
<input aria-label="Digit 3" class="w-16 h-16 text-center text-3xl rounded-lg border-2 border-outline bg-surface-container-lowest text-on-surface focus:border-focus focus:ring-2 focus:ring-focus focus:outline-none transition-all duration-200" maxlength="1" type="password"/>
<input aria-label="Digit 4" class="w-16 h-16 text-center text-3xl rounded-lg border-2 border-outline bg-surface-container-lowest text-on-surface focus:border-focus focus:ring-2 focus:ring-focus focus:outline-none transition-all duration-200" maxlength="1" type="password"/>
</div>
<!-- Actions -->
<div class="flex flex-col gap-4 w-full">
<button class="w-full bg-primary text-on-primary font-subheading text-subheading rounded-[12px] h-[60px] flex items-center justify-center hover:opacity-90 active:scale-[0.98] transition-all duration-200">
                אישור
            </button>
<button class="w-full bg-surface-container text-on-surface-variant font-subheading text-subheading rounded-[12px] h-[60px] flex items-center justify-center hover:bg-surface-variant active:scale-[0.98] transition-all duration-200">
                ביטול
            </button>
</div>
</div>
<script>
        // Simple script to auto-advance focus on PIN inputs
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input[type="password"]');
            inputs.forEach((input, index) => {
                input.addEventListener('input', function() {
                    if (this.value.length === 1 && index < inputs.length - 1) {
                        inputs[index + 1].focus();
                    }
                });
                
                input.addEventListener('keydown', function(e) {
                    if (e.key === 'Backspace' && this.value.length === 0 && index > 0) {
                        inputs[index - 1].focus();
                    }
                });
            });
            // Focus first input on load
            if(inputs.length > 0) inputs[0].focus();
        });
    </script>
</body></html>
