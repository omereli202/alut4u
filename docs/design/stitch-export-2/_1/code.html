        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>

<body class="bg-background text-on-background min-h-screen font-body flex flex-col" data-mode="user">
<!-- TopAppBar -->
<header class="bg-background dark:bg-on-background fixed top-0 w-full flex flex-row-reverse justify-between items-center px-6 h-16 z-50 transition-transform duration-200 flat no shadows">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center p-2 rounded-full text-primary dark:text-primary-fixed-dim hover:opacity-80 transition-opacity active:scale-95 transition-transform duration-200">
<span class="material-symbols-outlined">close</span>
</button>
</div>
<div class="font-subheading text-subheading font-medium text-on-surface dark:text-on-surface-variant font-bold tracking-tight">
            Social Story Reader
        </div>
</header>
<!-- Main Canvas -->
<main class="flex-grow pt-24 pb-32 px-8 flex flex-col items-center justify-center">
<!-- Lesson Header -->
<div class="w-full max-w-4xl flex items-center justify-between mb-12">
<h1 class="font-display-user text-display-user text-on-surface text-center flex-grow">
                הכלב שלי
            </h1>
<button class="flex items-center gap-2 text-primary hover:opacity-80 transition-opacity p-4 rounded-xl active:scale-98">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">arrow_back</span>
<span class="font-subheading text-subheading">חזרה</span>
</button>
</div>
<!-- Reading Passage -->
<div class="w-full max-w-4xl bg-surface rounded-xl shadow-md p-12 mb-12 text-center"><div class="flex flex-col items-center gap-2 mb-8">
<div class="flex gap-2">
<div class="w-2 h-2 rounded-full bg-primary-container"></div>
<div class="w-2 h-2 rounded-full bg-primary-container"></div>
<div class="w-2 h-2 rounded-full bg-primary-container"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
<div class="w-2 h-2 rounded-full bg-surface-container-highest"></div>
</div>
<span class="text-caption font-body text-on-surface-variant opacity-70">3 מתוך 5</span>
</div><div class="mb-8 flex justify-center"><img alt="A very simple, calm, and friendly illustration of a small happy dog playing with a ball" class="rounded-lg max-w-full h-auto" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCwGjGNNb9FN8owIgpxTLgjJvvkFSgbbQM2I5o0FG37o7JYt9KZGYshfTsQYkquVupRBaGoH9ncD4WmjXOr_ubbXjrQZgSaZ5LvBRSbZjPtOIX3cvlbHFQY32k9f9iQnmMwry0LyPVUkqGiCFZ1zQt2Itw1CsP8JqfohfKfPvUKeDccuGKs9FVAY27sCVnCMI9yLffAePNpF_cxx7M-4nVcQUOsBxtTcMwUJH4meR5eUYriQcybpSPXHQ"/></div>
<p class="font-display-user text-display-user text-on-surface leading-loose">
                זה הכלב שלי. קוראים לו רקס. רקס אוהב לשחק בכדור. 
                <br/><br/>
                הוא כלב טוב מאוד. אני אוהב את רקס.
            </p>
</div>
<!-- Action Buttons -->
<div class="flex flex-row flex-wrap justify-center gap-8 w-full max-w-4xl">
<button class="flex flex-col items-center justify-center bg-primary-container text-on-primary-container rounded-xl p-8 shadow-md hover:bg-surface-variant active:scale-98 transition-all min-w-[200px]">
<span class="material-symbols-outlined text-[4rem] mb-4" style="font-variation-settings: 'FILL' 1;">volume_up</span>
<span class="font-subheading text-subheading">שמיעה</span>
</button>
<button class="flex flex-col items-center justify-center bg-success text-on-primary rounded-xl p-8 shadow-md hover:opacity-80 active:scale-98 transition-all min-w-[200px]">
<span class="material-symbols-outlined text-[4rem] mb-4" style="font-variation-settings: 'FILL' 1;">check</span>
<span class="font-subheading text-subheading">קרא/ה יפה</span>
</button>
<button class="flex flex-col items-center justify-center bg-error-container text-on-error-container rounded-xl p-8 shadow-md hover:opacity-80 active:scale-98 transition-all min-w-[200px]">
<span class="material-symbols-outlined text-[4rem] mb-4" style="font-variation-settings: 'FILL' 1;">close</span>
<span class="font-subheading text-subheading">עוד תרגול</span>
</button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full flex flex-row-reverse justify-around items-center px-8 pb-4 bg-surface dark:bg-surface-container-lowest shadow-lg z-50 h-24">
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-8 py-3 hover:bg-surface-variant dark:hover:bg-surface-container-high active:scale-98 transition-all duration-200 rounded-xl">
<span class="material-symbols-outlined mb-1">arrow_forward</span>
<span class="font-body text-body">Next</span>
</button>
<button class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary-fixed text-on-primary-container dark:text-on-primary-fixed rounded-xl px-8 py-3 hover:bg-surface-variant dark:hover:bg-surface-container-high active:scale-98 transition-all duration-200">
<span class="material-symbols-outlined mb-1" style="font-variation-settings: 'FILL' 1;">volume_up</span>
<span class="font-body text-body">Speak</span>
</button>
<button class="flex flex-col items-center justify-center text-on-surface-variant dark:text-outline px-8 py-3 hover:bg-surface-variant dark:hover:bg-surface-container-high active:scale-98 transition-all duration-200 rounded-xl">
<span class="material-symbols-outlined mb-1">arrow_back</span>
<span class="font-body text-body">Back</span>
</button>
</nav>
</body></html>
