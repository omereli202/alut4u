<!DOCTYPE html>

<html dir="rtl" lang="he"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Voice Recorder States</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "tertiary-container": "#956e27",
                      "secondary-fixed-dim": "#a5d0be",
                      "surface-container-high": "#e8e8ec",
                      "inverse-on-surface": "#f1f0f5",
                      "primary": "#3a5d8b",
                      "on-tertiary-fixed-variant": "#604100",
                      "secondary": "#3e6658",
                      "tertiary-fixed": "#ffdeac",
                      "on-secondary-container": "#446c5e",
                      "on-tertiary": "#ffffff",
                      "on-tertiary-container": "#fffbff",
                      "surface-dim": "#dad9de",
                      "on-surface-variant": "#43474f",
                      "primary-fixed-dim": "#a6c8fd",
                      "inverse-primary": "#a6c8fd",
                      "border": "#DCDFE6",
                      "success": "#7FB069",
                      "surface-tint": "#3d608e",
                      "on-error": "#ffffff",
                      "secondary-container": "#c0ecda",
                      "on-secondary-fixed": "#002117",
                      "bg": "#F7F9F9",
                      "surface-container": "#eeedf2",
                      "on-primary-fixed": "#001c3a",
                      "on-primary-container": "#fdfcff",
                      "surface": "#FFFFFF",
                      "on-tertiary-fixed": "#281900",
                      "primary-container": "#5476a6",
                      "on-secondary": "#ffffff",
                      "text": "#2D3436",
                      "on-surface": "#1a1c1f",
                      "outline": "#737780",
                      "tertiary": "#79550e",
                      "error": "#ba1a1a",
                      "secondary-fixed": "#c0ecda",
                      "on-primary": "#ffffff",
                      "inverse-surface": "#2f3034",
                      "text-muted": "#636E72",
                      "surface-container-lowest": "#ffffff",
                      "surface-container-highest": "#e2e2e6",
                      "on-background": "#1a1c1f",
                      "error-container": "#ffdad6",
                      "surface-container-low": "#f4f3f7",
                      "tertiary-fixed-dim": "#efbf70",
                      "background": "#faf9fd",
                      "surface-bright": "#faf9fd",
                      "danger": "#D66853",
                      "on-secondary-fixed-variant": "#264e41",
                      "warning": "#E6A23C",
                      "outline-variant": "#c3c6d0",
                      "on-error-container": "#93000a",
                      "on-primary-fixed-variant": "#234875",
                      "surface-variant": "#e2e2e6",
                      "primary-fixed": "#d4e3ff",
                      "focus": "#4A90E2"
              },
              "borderRadius": {
                      "DEFAULT": "0.25rem",
                      "lg": "0.5rem",
                      "xl": "0.75rem",
                      "full": "9999px"
              },
              "spacing": {
                      "12": "3rem",
                      "8": "2rem",
                      "3": "0.75rem",
                      "6": "1.5rem",
                      "2": "0.5rem",
                      "1": "0.25rem",
                      "4": "1rem"
              },
              "fontFamily": {
                      "caption": ["Rubik"],
                      "subheading": ["Rubik"],
                      "body": ["Rubik"],
                      "heading-caregiver": ["Rubik"],
                      "display-user": ["Rubik"]
              },
              "fontSize": {
                      "caption": ["0.9rem", { "lineHeight": "1.4", "fontWeight": "400" }],
                      "subheading": ["1.4rem", { "lineHeight": "1.3", "fontWeight": "500" }],
                      "body": ["1.125rem", { "lineHeight": "1.4", "fontWeight": "400" }],
                      "heading-caregiver": ["1.9rem", { "lineHeight": "1.2", "fontWeight": "500" }],
                      "display-user": ["2.6rem", { "lineHeight": "1.15", "fontWeight": "500" }]
              }
            }
          }
        }
    </script>
<style>
        @keyframes pulse-ring {
            0% { transform: scale(0.8); opacity: 0.5; }
            100% { transform: scale(1.3); opacity: 0; }
        }
        .pulse-indicator::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: 50%;
            background-color: theme('colors.error');
            animation: pulse-ring 2s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        }
    </style>
</head>
<body class="bg-bg text-on-surface font-body p-8 min-h-screen flex flex-col items-center justify-center space-y-8" data-mode="caregiver">
<!-- Container for the demo states -->
<div class="w-full max-w-2xl bg-surface rounded-xl shadow-sm border border-border p-6 space-y-12">
<div class="border-b border-border pb-4 mb-6">
<h2 class="font-heading-caregiver text-heading-caregiver text-primary mb-2">מצבי הקלטת קול (תצוגת מטפל)</h2>
<p class="font-body text-body text-on-surface-variant">הדגמה של מצבי ההקלטה השונים עבור תהליך הוספת סמל.</p>
</div>
<!-- State 1: Idle -->
<div class="flex items-center justify-between p-4 bg-surface-container-low rounded-lg border border-border">
<div class="flex items-center gap-4">
<span class="font-subheading text-subheading text-on-surface">קול:</span>
<span class="font-body text-body text-on-surface-variant">אין הקלטה</span>
</div>
<button class="flex items-center gap-2 px-6 py-3 bg-primary text-on-primary rounded-lg font-subheading text-subheading hover:bg-surface-tint active:scale-95 transition-all focus:outline-none focus:ring-3 focus:ring-focus focus:ring-offset-2">
<span class="material-symbols-outlined" data-icon="mic" style="font-variation-settings: 'FILL' 1;">mic</span>
                הקלטה
            </button>
</div>
<!-- State 2: Consent (Dialog overlay style) -->
<div class="relative p-6 bg-surface-container rounded-lg border border-border overflow-hidden">
<!-- Simulated overlay background -->
<div class="absolute inset-0 bg-inverse-surface/10 backdrop-blur-sm z-0"></div>
<!-- Dialog Card -->
<div class="relative z-10 bg-surface p-6 rounded-xl shadow-md border border-outline-variant max-w-sm mx-auto text-center space-y-6">
<div class="mx-auto w-12 h-12 rounded-full bg-secondary-container flex items-center justify-center mb-4">
<span class="material-symbols-outlined text-on-secondary-container text-2xl" data-icon="security" style="font-variation-settings: 'FILL' 1;">security</span>
</div>
<p class="font-subheading text-subheading text-on-surface">הקלטת קול דורשת אישור. לאשר עכשיו?</p>
<div class="flex justify-center gap-4 mt-6">
<button class="px-6 py-3 bg-surface-variant text-on-surface-variant rounded-lg font-body text-body hover:bg-surface-container-highest active:scale-95 transition-all">
                         ביטול
                     </button>
<button class="px-6 py-3 bg-primary text-on-primary rounded-lg font-body text-body hover:bg-surface-tint active:scale-95 transition-all">
                         אישור
                     </button>
</div>
</div>
</div>
<!-- State 3: Recording -->
<div class="flex items-center justify-between p-4 bg-error-container rounded-lg border border-error/20">
<div class="flex items-center gap-4">
<span class="font-subheading text-subheading text-on-surface">קול:</span>
<div class="flex items-center gap-3">
<div class="relative w-4 h-4 flex items-center justify-center">
<div class="w-3 h-3 bg-error rounded-full relative z-10"></div>
<div class="pulse-indicator absolute inset-0 z-0"></div>
</div>
<span class="font-body text-body text-on-error-container font-medium">מקליט... (לחץ שוב לעצירה)</span>
</div>
</div>
<button class="flex items-center gap-2 px-6 py-3 bg-error text-on-error rounded-lg font-subheading text-subheading hover:bg-error/90 active:scale-95 transition-all focus:outline-none focus:ring-3 focus:ring-focus focus:ring-offset-2 shadow-sm">
<span class="material-symbols-outlined" data-icon="stop_circle" style="font-variation-settings: 'FILL' 1;">stop_circle</span>
                עצירה
            </button>
</div>
<!-- State 4: Done -->
<div class="flex items-center justify-between p-4 bg-secondary-container/30 rounded-lg border border-secondary-fixed">
<div class="flex items-center gap-4">
<span class="font-subheading text-subheading text-on-surface">קול:</span>
<div class="flex items-center gap-2 bg-surface px-4 py-2 rounded-full border border-border">
<span class="material-symbols-outlined text-success" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
<span class="font-body text-body text-on-surface-variant">הוקלט</span>
</div>
</div>
<div class="flex items-center gap-3">
<button aria-label="נגן הקלטה" class="w-12 h-12 flex items-center justify-center bg-secondary-container text-on-secondary-container rounded-full hover:bg-secondary-fixed transition-colors active:scale-95 focus:outline-none focus:ring-3 focus:ring-focus">
<span class="material-symbols-outlined" data-icon="play_arrow" style="font-variation-settings: 'FILL' 1;">play_arrow</span>
</button>
<button class="flex items-center gap-2 px-4 py-2 bg-surface text-error border border-error/30 rounded-lg font-body text-body hover:bg-error-container transition-colors active:scale-95 focus:outline-none focus:ring-3 focus:ring-focus">
<span class="material-symbols-outlined text-[1.2rem]" data-icon="delete">delete</span>
                    הסר הקלטה
                </button>
</div>
</div>
</div>
</body></html>
