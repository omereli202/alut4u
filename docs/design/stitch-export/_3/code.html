<!DOCTYPE html><html class="light" dir="rtl" lang="he"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>Visual Daily Schedule - Focus Screen</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                    "on-background": "#1a1c1f",
                    "on-primary-container": "#fdfcff",
                    "surface-tint": "#3d608e",
                    "surface": "#FFFFFF",
                    "inverse-on-surface": "#f1f0f5",
                    "on-tertiary-container": "#fffbff",
                    "on-tertiary-fixed": "#281900",
                    "on-tertiary": "#ffffff",
                    "outline-variant": "#c3c6d0",
                    "tertiary-fixed-dim": "#efbf70",
                    "primary-fixed": "#d4e3ff",
                    "text-muted": "#636E72",
                    "tertiary": "#79550e",
                    "background": "#faf9fd",
                    "text": "#2D3436",
                    "on-surface": "#1a1c1f",
                    "surface-container": "#eeedf2",
                    "tertiary-fixed": "#ffdeac",
                    "on-secondary-container": "#446c5e",
                    "danger": "#D66853",
                    "on-secondary-fixed-variant": "#264e41",
                    "on-primary": "#ffffff",
                    "surface-container-low": "#f4f3f7",
                    "on-primary-fixed": "#001c3a",
                    "primary": "#3a5d8b",
                    "on-secondary": "#ffffff",
                    "warning": "#E6A23C",
                    "on-secondary-fixed": "#002117",
                    "secondary-fixed": "#c0ecda",
                    "inverse-primary": "#a6c8fd",
                    "surface-container-lowest": "#ffffff",
                    "tertiary-container": "#956e27",
                    "on-tertiary-fixed-variant": "#604100",
                    "border": "#DCDFE6",
                    "primary-container": "#5476a6",
                    "surface-variant": "#e2e2e6",
                    "surface-container-high": "#e8e8ec",
                    "secondary": "#3e6658",
                    "bg": "#F7F9F9",
                    "outline": "#737780",
                    "surface-dim": "#dad9de",
                    "on-error-container": "#93000a",
                    "surface-bright": "#faf9fd",
                    "surface-container-highest": "#e2e2e6",
                    "secondary-container": "#c0ecda",
                    "primary-fixed-dim": "#a6c8fd",
                    "on-surface-variant": "#43474f",
                    "success": "#7FB069",
                    "inverse-surface": "#2f3034",
                    "error": "#ba1a1a",
                    "on-primary-fixed-variant": "#234875",
                    "focus": "#4A90E2",
                    "error-container": "#ffdad6",
                    "on-error": "#ffffff",
                    "secondary-fixed-dim": "#a5d0be"
            },
            "borderRadius": {
                    "DEFAULT": "0.25rem",
                    "lg": "0.5rem",
                    "xl": "0.75rem",
                    "full": "9999px"
            },
            "spacing": {
                    "1": "0.25rem",
                    "6": "1.5rem",
                    "2": "0.5rem",
                    "12": "3rem",
                    "4": "1rem",
                    "8": "2rem",
                    "3": "0.75rem"
            },
            "fontFamily": {
                    "body": [
                            "Rubik"
                    ],
                    "caption": [
                            "Rubik"
                    ],
                    "display-user": [
                            "Rubik"
                    ],
                    "subheading": [
                            "Rubik"
                    ],
                    "heading-caregiver": [
                            "Rubik"
                    ]
            },
            "fontSize": {
                    "body": [
                            "1.125rem",
                            {
                                    "lineHeight": "1.4",
                                    "fontWeight": "400"
                            }
                    ],
                    "caption": [
                            "0.9rem",
                            {
                                    "lineHeight": "1.4",
                                    "fontWeight": "400"
                            }
                    ],
                    "display-user": [
                            "2.6rem",
                            {
                                    "lineHeight": "1.15",
                                    "fontWeight": "500"
                            }
                    ],
                    "subheading": [
                            "1.4rem",
                            {
                                    "lineHeight": "1.3",
                                    "fontWeight": "500"
                            }
                    ],
                    "heading-caregiver": [
                            "1.9rem",
                            {
                                    "lineHeight": "1.2",
                                    "fontWeight": "500"
                            }
                    ]
            }
        }
        }
      }
    </script>
<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-background min-h-screen flex flex-col items-center justify-center font-body text-on-surface" data-mode="user">
<!-- Top Navigation Bar -->
<header class="w-full fixed top-0 flex justify-between items-center px-6 py-4 bg-surface shadow-sm z-50 h-[80px]">
<!-- Right side (RTL start) - Exit -->
<button class="flex items-center justify-center gap-2 h-[60px] px-6 rounded-full bg-surface-container hover:bg-surface-container-high transition-transform active:scale-95 shadow-sm">
<span aria-hidden="true" class="material-symbols-outlined text-[28px] text-danger">logout</span>
<span class="font-subheading text-subheading text-danger">יציאה</span>
</button>
<!-- Center - Child's Name -->
<h1 class="font-display-user text-display-user text-primary font-bold tracking-tight text-center absolute left-1/2 -translate-x-1/2">נועה</h1>
<!-- Left side (RTL end) - Month View -->
<button class="flex items-center justify-center gap-2 h-[60px] px-6 rounded-full bg-surface-container hover:bg-surface-container-high transition-transform active:scale-95 shadow-sm">
<span class="font-subheading text-subheading text-primary">📅 חודש</span>
</button>
</header>
<!-- Main Content Area -->
<main class="flex-1 w-full max-w-6xl mt-[100px] mb-[100px] px-8 flex flex-col items-center justify-center gap-8">
<!-- Progress Indicator -->
<div class="flex flex-col items-center gap-3">
<div aria-label="Progress: 3 out of 6 completed" class="flex gap-4">
<div class="w-6 h-6 rounded-full bg-success"></div>
<div class="w-6 h-6 rounded-full bg-success"></div>
<div class="w-6 h-6 rounded-full bg-success"></div>
<div class="w-6 h-6 rounded-full bg-surface-container-high"></div>
<div class="w-6 h-6 rounded-full bg-surface-container-high"></div>
<div class="w-6 h-6 rounded-full bg-surface-container-high"></div>
</div>
<span class="font-caption text-caption text-text-muted">3 מתוך 6 הושלמו</span>
</div>
<!-- Central Focus Area -->
<div class="flex items-center justify-center gap-12 w-full">
<!-- Main Activity Card -->
<div class="bg-surface rounded-[32px] shadow-sm p-12 flex flex-col items-center justify-center gap-6 w-full max-w-2xl border-4 border-transparent hover:border-primary-fixed transition-colors">
<div class="w-48 h-48 bg-primary-fixed rounded-full flex items-center justify-center mb-4">
<span class="text-[96px]">🥞</span>
</div>
<h2 class="font-display-user text-[4rem] leading-none text-on-surface font-bold text-center">ארוחת בוקר</h2>
<p class="font-subheading text-subheading text-text-muted text-center mt-2">08:00 - 08:30</p>
</div>
<!-- Primary Action Button (Check) -->
<button aria-label="Mark as done" class="w-[140px] h-[140px] rounded-full bg-success flex items-center justify-center shadow-lg hover:bg-[#6CA057] active:scale-95 transition-all focus:ring-4 focus:ring-focus focus:ring-offset-4 focus:outline-none shrink-0">
<span class="material-symbols-outlined text-[72px] text-on-primary">check</span>
</button>
</div>
</main>
<!-- Bottom Secondary Actions -->
<footer class="w-full fixed bottom-0 left-0 right-0 p-8 flex justify-center gap-8 bg-gradient-to-t from-background to-transparent pointer-events-none">
<button class="pointer-events-auto h-[60px] px-8 rounded-full bg-surface shadow-sm text-primary font-subheading text-subheading hover:bg-surface-container transition-transform active:scale-95">
            כל היום
        </button>
<button class="pointer-events-auto h-[60px] px-8 rounded-full bg-surface shadow-sm text-text-muted font-subheading text-subheading hover:bg-surface-container transition-transform active:scale-95">
            יציאה
        </button>
</footer>
</body></html>
