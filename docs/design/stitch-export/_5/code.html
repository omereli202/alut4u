<!DOCTYPE html><html dir="rtl" lang="he"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>לוח תקשורת - נועה</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-dim": "#dad9de",
                        "inverse-surface": "#2f3034",
                        "on-surface-variant": "#43474f",
                        "on-error": "#ffffff",
                        "on-background": "#1a1c1f",
                        "on-primary-fixed": "#001c3a",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#f1f0f5",
                        "tertiary": "#79550e",
                        "secondary-fixed": "#c0ecda",
                        "tertiary-fixed-dim": "#efbf70",
                        "surface-container-high": "#e8e8ec",
                        "text": "#2D3436",
                        "surface-container-low": "#f4f3f7",
                        "on-tertiary-container": "#fffbff",
                        "error-container": "#ffdad6",
                        "on-tertiary-fixed-variant": "#604100",
                        "primary-fixed": "#d4e3ff",
                        "primary-fixed-dim": "#a6c8fd",
                        "danger": "#D66853",
                        "on-primary": "#ffffff",
                        "on-secondary-container": "#446c5e",
                        "surface-container": "#eeedf2",
                        "secondary-container": "#c0ecda",
                        "tertiary-fixed": "#ffdeac",
                        "on-error-container": "#93000a",
                        "inverse-primary": "#a6c8fd",
                        "on-primary-fixed-variant": "#234875",
                        "surface-variant": "#e2e2e6",
                        "error": "#ba1a1a",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#a5d0be",
                        "on-surface": "#1a1c1f",
                        "on-primary-container": "#fdfcff",
                        "tertiary-container": "#956e27",
                        "secondary": "#3e6658",
                        "surface-bright": "#faf9fd",
                        "focus": "#4A90E2",
                        "outline": "#737780",
                        "text-muted": "#636E72",
                        "on-secondary-fixed-variant": "#264e41",
                        "surface-tint": "#3d608e",
                        "on-secondary-fixed": "#002117",
                        "primary": "#3a5d8b",
                        "on-secondary": "#ffffff",
                        "success": "#7FB069",
                        "surface": "#FFFFFF",
                        "outline-variant": "#c3c6d0",
                        "background": "#faf9fd",
                        "surface-container-highest": "#e2e2e6",
                        "border": "#DCDFE6",
                        "on-tertiary-fixed": "#281900",
                        "primary-container": "#5476a6",
                        "warning": "#E6A23C",
                        "bg": "#F7F9F9"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "3": "0.75rem",
                        "6": "1.5rem",
                        "8": "2rem",
                        "12": "3rem",
                        "4": "1rem",
                        "1": "0.25rem",
                        "2": "0.5rem"
                    },
                    "fontFamily": {
                        "subheading": ["Rubik"],
                        "caption": ["Rubik"],
                        "heading-caregiver": ["Rubik"],
                        "display-user": ["Rubik"],
                        "body": ["Rubik"]
                    }
                }
            }
        }
    </script>
<style>
        body {
            font-family: 'Rubik', sans-serif;
            background-color: var(--color-background);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .icon-fill {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-scale {
            transition: transform 0.15s ease;
        }
        .active-scale:active {
            transform: scale(0.95);
        }
    </style>
</head>
<body class="bg-background text-on-background min-h-screen flex flex-col" data-mode="user">
<!-- TopAppBar -->
<header class="bg-surface-bright dark:bg-surface-dim shadow-sm flex flex-row justify-between items-center px-6 w-full h-16 fixed top-0 z-50">
<div class="flex items-center gap-4">
<button class="flex items-center gap-2 text-primary hover:bg-surface-container active-scale p-2 rounded-xl transition-colors">
<span class="material-symbols-outlined">logout</span>
<span class="font-subheading text-subheading">יציאה</span>
</button>
</div>
<div class="absolute left-1/2 transform -translate-x-1/2">
<h1 class="font-display-user text-2xl font-bold text-primary">נועה</h1>
</div>
<div class="flex items-center gap-4 bg-surface-container-low rounded-full px-4 py-1 border border-border">
<span class="font-caption text-caption text-on-surface-variant ml-2">גודל הרשת</span>
<button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-variant active-scale text-primary">
<span class="material-symbols-outlined">remove</span>
</button>
<span class="font-subheading text-subheading w-6 text-center">3</span>
<button class="w-8 h-8 flex items-center justify-center rounded-full hover:bg-surface-variant active-scale text-primary">
<span class="material-symbols-outlined">add</span>
</button>
</div>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 mt-16 flex flex-col p-8 gap-6 w-full max-w-6xl mx-auto">
<!-- Sentence Bar -->
<div class="bg-surface rounded-2xl shadow-sm border border-surface-variant p-4 flex items-center justify-between min-h-[100px]">
<div class="flex flex-row items-center gap-3 overflow-x-auto flex-1 min-h-[60px]" id="sentence-container">
<!-- Example constructed sentence chips -->
<div class="bg-primary-container text-on-primary-container px-6 py-3 rounded-full font-subheading text-subheading flex items-center gap-2 shadow-sm">
<span class="material-symbols-outlined">person</span>
                    אני
                </div>
<div class="bg-primary-container text-on-primary-container px-6 py-3 rounded-full font-subheading text-subheading flex items-center gap-2 shadow-sm">
<span class="material-symbols-outlined">sentiment_satisfied</span>
                    מרגיש
                </div>
<div class="border-2 border-dashed border-outline-variant rounded-full px-8 py-4 opacity-50 flex-1 max-w-[200px]"></div>
</div>
<div class="flex items-center gap-4 mr-6 border-r border-border pr-6">
<button class="bg-primary text-on-primary w-14 h-14 rounded-full flex items-center justify-center hover:brightness-95 active-scale shadow-md transition-all">
<span class="material-symbols-outlined icon-fill text-3xl">play_arrow</span>
</button>
<div class="flex flex-col gap-2">
<button class="text-on-surface-variant hover:text-danger active-scale transition-colors flex items-center justify-center p-2 rounded-full hover:bg-error-container">
<span class="material-symbols-outlined text-2xl">backspace</span>
</button>
<button class="text-on-surface-variant hover:text-danger active-scale transition-colors font-subheading text-sm font-medium px-2 py-1 rounded hover:bg-error-container">
                        נקה
                    </button>
</div>
</div>
</div>
<!-- Category Tabs -->
<div class="flex overflow-x-auto gap-4 py-2 scrollbar-hide border-b border-border">
<button class="px-6 py-3 rounded-full font-subheading text-subheading text-on-surface-variant hover:bg-surface-container transition-colors active-scale whitespace-nowrap">
                אוכל
            </button>
<button class="px-6 py-3 rounded-full font-subheading text-subheading bg-secondary-container text-on-secondary-container shadow-sm border border-secondary-fixed transition-colors active-scale whitespace-nowrap font-bold flex items-center gap-2">
<span class="material-symbols-outlined icon-fill text-secondary">mood</span>
                רגשות
            </button>
<button class="px-6 py-3 rounded-full font-subheading text-subheading text-on-surface-variant hover:bg-surface-container transition-colors active-scale whitespace-nowrap">
                פעילויות
            </button>
<button class="px-6 py-3 rounded-full font-subheading text-subheading text-on-surface-variant hover:bg-surface-container transition-colors active-scale whitespace-nowrap">
                אנשים
            </button>
</div>
<!-- AAC Card Grid -->
<div class="grid grid-cols-3 gap-6 flex-1 mt-4">
<!-- Card 1: Happy -->
<button class="bg-surface rounded-3xl shadow-sm border-2 border-transparent hover:border-primary-fixed-dim hover:shadow-md transition-all duration-200 active-scale flex flex-col items-center justify-center p-8 gap-6 aspect-square overflow-hidden relative group">
<div class="absolute inset-0 bg-primary opacity-0 group-active:opacity-10 transition-opacity"></div>
<div class="w-32 h-32 rounded-full bg-secondary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-6xl text-on-secondary-container icon-fill">sentiment_satisfied_alt</span>
</div>
<span class="font-display-user text-2xl text-on-surface">שמח</span>
</button>
<!-- Card 2: Sad -->
<button class="bg-surface rounded-3xl shadow-sm border-2 border-transparent hover:border-primary-fixed-dim hover:shadow-md transition-all duration-200 active-scale flex flex-col items-center justify-center p-8 gap-6 aspect-square overflow-hidden relative group">
<div class="absolute inset-0 bg-primary opacity-0 group-active:opacity-10 transition-opacity"></div>
<div class="w-32 h-32 rounded-full bg-tertiary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-6xl text-on-tertiary-container icon-fill">sentiment_dissatisfied</span>
</div>
<span class="font-display-user text-2xl text-on-surface">עצוב</span>
</button>
<!-- Card 3: Angry -->
<button class="bg-surface rounded-3xl shadow-sm border-2 border-transparent hover:border-primary-fixed-dim hover:shadow-md transition-all duration-200 active-scale flex flex-col items-center justify-center p-8 gap-6 aspect-square overflow-hidden relative group">
<div class="absolute inset-0 bg-primary opacity-0 group-active:opacity-10 transition-opacity"></div>
<div class="w-32 h-32 rounded-full bg-error-container flex items-center justify-center">
<span class="material-symbols-outlined text-6xl text-on-error-container icon-fill">sentiment_very_dissatisfied</span>
</div>
<span class="font-display-user text-2xl text-on-surface">כועס</span>
</button>
<!-- Card 4: Tired -->
<button class="bg-surface rounded-3xl shadow-sm border-2 border-transparent hover:border-primary-fixed-dim hover:shadow-md transition-all duration-200 active-scale flex flex-col items-center justify-center p-8 gap-6 aspect-square overflow-hidden relative group">
<div class="absolute inset-0 bg-primary opacity-0 group-active:opacity-10 transition-opacity"></div>
<div class="w-32 h-32 rounded-full bg-surface-variant flex items-center justify-center">
<span class="material-symbols-outlined text-6xl text-on-surface-variant icon-fill">bedtime</span>
</div>
<span class="font-display-user text-2xl text-on-surface">עייף</span>
</button>
<!-- Card 5: Scared -->
<button class="bg-surface rounded-3xl shadow-sm border-2 border-transparent hover:border-primary-fixed-dim hover:shadow-md transition-all duration-200 active-scale flex flex-col items-center justify-center p-8 gap-6 aspect-square overflow-hidden relative group">
<div class="absolute inset-0 bg-primary opacity-0 group-active:opacity-10 transition-opacity"></div>
<div class="w-32 h-32 rounded-full bg-primary-fixed flex items-center justify-center">
<span class="material-symbols-outlined text-6xl text-on-primary-fixed icon-fill">sentiment_sad</span>
</div>
<span class="font-display-user text-2xl text-on-surface">מפוחד</span>
</button>
<!-- Card 6: Proud -->
<button class="bg-surface rounded-3xl shadow-sm border-2 border-transparent hover:border-primary-fixed-dim hover:shadow-md transition-all duration-200 active-scale flex flex-col items-center justify-center p-8 gap-6 aspect-square overflow-hidden relative group">
<div class="absolute inset-0 bg-primary opacity-0 group-active:opacity-10 transition-opacity"></div>
<div class="w-32 h-32 rounded-full bg-tertiary-fixed-dim flex items-center justify-center">
<span class="material-symbols-outlined text-6xl text-tertiary-container icon-fill">star</span>
</div>
<span class="font-display-user text-2xl text-on-surface">גאה</span>
</button>
</div>
</main>
<!-- SideNavBar (Suppressed in this intent, only keeping core AAC shell as requested by user layout prompt) -->
<!-- Note: BottomNavBar is not rendered because this is a focused user mode screen, relying on the top bar and sentence bar for primary actions. -->
</body></html>
