<!DOCTYPE html><html dir="rtl" lang="he"><head>
<meta charset="utf-8">
<meta content="width=device-width, initial-scale=1.0" name="viewport">
<title>לוח תקשורת - נועה - רגשות</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

        tailwind.config = {
            darkMode: "class",

                extend: {
                    "colors": {

                        "on-tertiary-fixed-variant": "#604100",

                        "warning": "#E6A23C",
                        "on-primary-fixed-variant": "#234875",
                        "primary": "#3a5d8b",
                        "outline": "#737780",
                        "primary-fixed-dim": "#a6c8fd",
                        "surface-container-lowest": "#ffffff",
                        "border": "#DCDFE6",
                        "on-tertiary-fixed": "#281900",
                        "focus": "#4A90E2",
                        "on-surface-variant": "#43474f",
                        "on-secondary-container": "#446c5e",
                        "on-primary-fixed": "#001c3a",
                        "on-primary-container": "#fdfcff",
                        "tertiary-container": "#956e27",
                        "surface-container-low": "#f4f3f7",
                        "inverse-primary": "#a6c8fd",
                        "primary-fixed": "#d4e3ff",
                        "tertiary-fixed": "#ffdeac",
                        "on-secondary-fixed-variant": "#264e41",
                        "on-secondary-fixed": "#002117",
                        "surface-tint": "#3d608e",
                        "outline-variant": "#c3c6d0",
                        "secondary-container": "#c0ecda",
                        "on-tertiary": "#ffffff",
                        "error-container": "#ffdad6",
                        "danger": "#D66853",
                        "secondary-fixed-dim": "#a5d0be",
                        "tertiary-fixed-dim": "#efbf70",
                        "success": "#7FB069",
                        "surface-dim": "#dad9de",
                        "surface-variant": "#e2e2e6",
                        "surface-bright": "#faf9fd",
                        "on-error-container": "#93000a",
                        "error": "#ba1a1a",
                        "inverse-on-surface": "#f1f0f5",
                        "on-error": "#ffffff",
                        "text-muted": "#636E72",
                        "primary-container": "#5476a6",
                        "secondary": "#3e6658",
                        "surface-container": "#eeedf2",
                        "on-background": "#1a1c1f",
                        "on-tertiary-container": "#fffbff",
                        "inverse-surface": "#2f3034",
                        "on-secondary": "#ffffff",
                        "surface": "#FFFFFF",
                        "surface-container-high": "#e8e8ec"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "2": "0.5rem",
                        "4": "1rem",
                        "6": "1.5rem",
                        "8": "2rem",
                        "3": "0.75rem",
                        "1": "0.25rem",
                        "12": "3rem"
                    },
                    "fontFamily": {
                        "subheading": ["Rubik"],
                        "body": ["Rubik"],
                        "display-user": ["Rubik"],
                        "heading-caregiver": ["Rubik"],
                        "caption": ["Rubik"]
                    },
                    "fontSize": {
                        "subheading": ["1.4rem", { "lineHeight": "1.3", "fontWeight": "500" }],
                        "body": ["1.125rem", { "lineHeight": "1.4", "fontWeight": "400" }],
                        "display-user": ["2.6rem", { "lineHeight": "1.15", "fontWeight": "500" }],
                        "heading-caregiver": ["1.9rem", { "lineHeight": "1.2", "fontWeight": "500" }],
                        "caption": ["0.9rem", { "lineHeight": "1.4", "fontWeight": "400" }]

                }
            }
        }
    </script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;700&amp;display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet">
<style>
        body {
            font-family: 'Rubik', sans-serif;
            background-color: #F7F9F9;
        }
        .user-mode-tile {
            transition: transform 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        .user-mode-tile:active {
            transform: scale(0.96);
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body class="bg-bg text-text min-h-screen flex flex-col overflow-hidden" data-mode="user">
<!-- TopAppBar from JSON Anchor -->
<header class="bg-surface shadow-sm docked full-width top-0 flex flex-row-reverse justify-between items-center w-full px-6 py-4 z-50">
<div class="flex-shrink-0">
<button aria-label="יציאה" class="bg-surface-container-low hover:bg-surface-variant text-on-surface p-3 rounded-full flex items-center justify-center transition-colors shadow-sm">
<span class="material-symbols-outlined" data-icon="exit_to_app" style="font-size: 2rem;">exit_to_app</span>
</button>
</div>
<div class="flex-grow text-center">
<h1 class="font-display-user text-display-user text-primary font-bold tracking-tight">נועה</h1>
</div>
<div class="flex-shrink-0 w-16">
<!-- Spacer to keep title centered -->
</div>
</header>
<!-- Sentence Bar Layer (Elevation 2) -->
<div class="bg-surface border-b border-border shadow-sm z-40 px-8 py-4 min-h-[100px] flex items-center gap-4 overflow-x-auto">
<div class="flex gap-3 h-full items-center">
<!-- Selected Chips Placeholder -->
<div class="bg-primary-container text-on-primary-container px-6 py-3 rounded-xl font-subheading text-subheading flex items-center gap-3 shadow-sm">
<span class="material-symbols-outlined text-3xl" data-icon="person">person</span>
<span>אני</span>
</div>
<div class="bg-primary-container text-on-primary-container px-6 py-3 rounded-xl font-subheading text-subheading flex items-center gap-3 shadow-sm">
<span class="material-symbols-outlined text-3xl" data-icon="sentiment_satisfied">sentiment_satisfied</span>
<span>מרגיש</span>
</div>
<!-- Empty drop zone hint -->
<div class="border-2 border-dashed border-outline-variant rounded-xl h-[60px] w-[140px] flex items-center justify-center opacity-50">
<span class="font-body text-body text-outline">הוסף מילה...</span>
</div>
</div>
<div class="mr-auto flex gap-2">
<button aria-label="מחק מילה אחרונה" class="bg-surface-container-highest text-on-surface-variant p-4 rounded-xl hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-2xl" data-icon="backspace">backspace</span>
</button>
<button aria-label="השמע משפט" class="bg-primary text-on-primary p-4 rounded-xl hover:bg-primary-container hover:text-on-primary-container transition-colors shadow-sm">
<span class="material-symbols-outlined text-2xl" data-icon="volume_up">volume_up</span>
</button>
</div>
</div>
<!-- Main Content: Emotion Grid (Landscape optimized, 4 columns) -->
<main class="flex-grow overflow-y-auto p-8 z-10">
<div class="grid grid-cols-4 gap-6 max-w-7xl mx-auto h-full">
<!-- Happy -->
<button class="user-mode-tile bg-surface rounded-[24px] shadow-sm flex flex-col items-center justify-center p-8 border-2 border-transparent focus:border-focus focus:outline-none aspect-square group">
<div class="w-24 h-24 rounded-full bg-success/20 flex items-center justify-center mb-6 group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-success" data-icon="sentiment_very_satisfied" style="font-size: 4rem;">sentiment_very_satisfied</span>
</div>
<span class="font-subheading text-subheading text-on-surface font-bold">שמח</span>
</button>
<!-- Sad -->
<button class="user-mode-tile bg-surface rounded-[24px] shadow-sm flex flex-col items-center justify-center p-8 border-2 border-transparent focus:border-focus focus:outline-none aspect-square group">
<div class="w-24 h-24 rounded-full bg-primary/20 flex items-center justify-center mb-6 group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-primary" data-icon="sentiment_dissatisfied" style="font-size: 4rem;">sentiment_dissatisfied</span>
</div>
<span class="font-subheading text-subheading text-on-surface font-bold">עצוב</span>
</button>
<!-- Angry -->
<button class="user-mode-tile bg-surface rounded-[24px] shadow-sm flex flex-col items-center justify-center p-8 border-2 border-transparent focus:border-focus focus:outline-none aspect-square group">
<div class="w-24 h-24 rounded-full bg-danger/20 flex items-center justify-center mb-6 group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-danger" data-icon="mood_bad" style="font-size: 4rem;">mood_bad</span>
</div>
<span class="font-subheading text-subheading text-on-surface font-bold">כועס</span>
</button>
<!-- Tired -->
<button class="user-mode-tile bg-surface rounded-[24px] shadow-sm flex flex-col items-center justify-center p-8 border-2 border-transparent focus:border-focus focus:outline-none aspect-square group">
<div class="w-24 h-24 rounded-full bg-surface-variant flex items-center justify-center mb-6 group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-outline" data-icon="bedtime" style="font-size: 4rem;">bedtime</span>
</div>
<span class="font-subheading text-subheading text-on-surface font-bold">עייף</span>
</button>
<!-- Hungry -->
<button class="user-mode-tile bg-surface rounded-[24px] shadow-sm flex flex-col items-center justify-center p-8 border-2 border-transparent focus:border-focus focus:outline-none aspect-square group">
<div class="w-24 h-24 rounded-full bg-warning/20 flex items-center justify-center mb-6 group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-warning" data-icon="restaurant" style="font-size: 4rem;">restaurant</span>
</div>
<span class="font-subheading text-subheading text-on-surface font-bold">רעב</span>
</button>
<!-- Thirsty -->
<button class="user-mode-tile bg-surface rounded-[24px] shadow-sm flex flex-col items-center justify-center p-8 border-2 border-transparent focus:border-focus focus:outline-none aspect-square group">
<div class="w-24 h-24 rounded-full bg-focus/20 flex items-center justify-center mb-6 group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-focus" data-icon="water_drop" style="font-size: 4rem;">water_drop</span>
</div>
<span class="font-subheading text-subheading text-on-surface font-bold">צמא</span>
</button>
<!-- Hurts -->
<button class="user-mode-tile bg-surface rounded-[24px] shadow-sm flex flex-col items-center justify-center p-8 border-2 border-transparent focus:border-focus focus:outline-none aspect-square group">
<div class="w-24 h-24 rounded-full bg-error-container flex items-center justify-center mb-6 group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-error" data-icon="healing" style="font-size: 4rem;">healing</span>
</div>
<span class="font-subheading text-subheading text-on-surface font-bold">כואב לי</span>
</button>
<!-- Feeling Good -->
<button class="user-mode-tile bg-surface rounded-[24px] shadow-sm flex flex-col items-center justify-center p-8 border-2 border-transparent focus:border-focus focus:outline-none aspect-square group">
<div class="w-24 h-24 rounded-full bg-secondary-fixed flex items-center justify-center mb-6 group-hover:scale-105 transition-transform">
<span class="material-symbols-outlined text-secondary" data-icon="favorite" data-weight="fill" style="font-size: 4rem; font-variation-settings: 'FILL' 1;">favorite</span>
</div>
<span class="font-subheading text-subheading text-on-surface font-bold">מרגיש טוב</span>
</button>
</div>
</main>
<!-- SideNavBar (Hidden on this transactional/focused screen to prioritize communication canvas, adhering to Shell Visibility mandate) -->
</body></html>
