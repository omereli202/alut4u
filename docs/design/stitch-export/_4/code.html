<!DOCTYPE html><html class="dark" dir="rtl" lang="he"><head>

                    "on-error-container": "#93000a",
                    "focus": "#4A90E2",

                    "secondary": "#3e6658",
                    "surface-container-low": "#f4f3f7",

                    "on-tertiary-container": "#fffbff",

                    ],
                    "heading-caregiver": [

<style>
        body {
            /* Force light mode per instructions, despite class="dark" fallback */
            background-color: theme('colors.bg');
            color: theme('colors.on-background');
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        
        .material-symbols-outlined[data-weight="fill"] {
            font-variation-settings: 'FILL' 1, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

        /* Interaction states */
        .btn-press:active {
            transform: scale(0.98);
            transition: transform 0.1s ease-in-out;
        }
    </style>
</head>
<body class="font-body text-body font-body text-body bg-bg min-h-screen flex flex-col" data-mode="user">
<!-- Top Navigation Bar -->
<header class="flex justify-between items-center w-full px-6 py-4 bg-surface shadow-sm h-[88px] flex-shrink-0 z-10 sticky top-0">
<!-- Next Month (Right in RTL = previous month logically, but points right) -->
<button aria-label="חודש קודם" class="w-[60px] h-[60px] rounded-xl bg-surface-container-highest text-on-surface-variant flex items-center justify-center btn-press hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-3xl">chevron_right</span>
</button>
<!-- Centered Title -->
<h1 class="font-display-user text-display-user text-primary text-center m-0 p-0 tracking-tight leading-none">מרץ 2026</h1>
<!-- Controls Container (Left side in RTL) -->
<div class="flex items-center space-x-reverse space-x-4">
<!-- Previous Month (Left in RTL = next month logically, points left) -->
<button aria-label="חודש הבא" class="w-[60px] h-[60px] rounded-xl bg-surface-container-highest text-on-surface-variant flex items-center justify-center btn-press hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-3xl">chevron_left</span>
</button>
<!-- Exit Button -->
<button aria-label="יציאה" class="w-[60px] h-[60px] rounded-xl bg-surface-container-highest text-on-surface-variant flex items-center justify-center btn-press hover:bg-surface-variant transition-colors">
<span class="material-symbols-outlined text-3xl">logout</span>
</button>
</div>
</header>
<!-- Main Content Area: Calendar Grid -->
<main class="flex-grow flex flex-col p-6 w-full max-w-[1200px] mx-auto gap-4">
<!-- Weekday Headers -->
<div class="grid grid-cols-7 gap-4 mb-2">
<div class="text-center font-subheading text-subheading text-text-muted py-2">א׳</div>
<div class="text-center font-subheading text-subheading text-text-muted py-2">ב׳</div>
<div class="text-center font-subheading text-subheading text-text-muted py-2">ג׳</div>
<div class="text-center font-subheading text-subheading text-text-muted py-2">ד׳</div>
<div class="text-center font-subheading text-subheading text-text-muted py-2">ה׳</div>
<div class="text-center font-subheading text-subheading text-text-muted py-2">ו׳</div>
<div class="text-center font-subheading text-subheading text-text-muted py-2">ש׳</div>
</div>
<!-- Calendar Cells -->
<!-- 
          Using a responsive grid layout. 
          Min-height 72px for touch targets as requested, but we'll use a slightly taller min-height
          to allow room for event labels comfortably while maintaining the low-arousal aesthetic.
        -->
<div class="grid grid-cols-7 gap-4 flex-grow auto-rows-fr">
<!-- Empty cells from previous month -->
<div class="bg-surface-container-low rounded-xl min-h-[100px] p-3 opacity-50 flex flex-col items-center">
<span class="font-body text-body text-text-muted">28</span>
</div>
<!-- Day 1 -->
<button class="bg-surface rounded-xl min-h-[100px] p-3 shadow-sm flex flex-col items-center justify-start btn-press hover:bg-surface-container transition-colors">
<span class="font-subheading text-subheading text-on-surface mb-1">1</span>
</button>
<!-- Day 2 -->
<button class="bg-surface rounded-xl min-h-[100px] p-3 shadow-sm flex flex-col items-center justify-start btn-press hover:bg-surface-container transition-colors">
<span class="font-subheading text-subheading text-on-surface mb-1">2</span>
</button>
<!-- Day 3 - Event -->
<button class="bg-surface rounded-xl min-h-[100px] p-3 shadow-sm flex flex-col items-center justify-start btn-press hover:bg-surface-container transition-colors">
<span class="font-subheading text-subheading text-on-surface mb-1">3</span>
<span class="bg-secondary-container text-on-secondary-container font-caption text-caption px-2 py-1 rounded-full w-full text-center truncate mt-auto">יום הולדת</span>
</button>
<!-- Day 4 -->
<button class="bg-surface rounded-xl min-h-[100px] p-3 shadow-sm flex flex-col items-center justify-start btn-press hover:bg-surface-container transition-colors">
<span class="font-subheading text-subheading text-on-surface mb-1">4</span>
</button>
<!-- Day 5 -->
<button class="bg-surface rounded-xl min-h-[100px] p-3 shadow-sm flex flex-col items-center justify-start btn-press hover:bg-surface-container transition-colors">
<span class="font-subheading text-subheading text-on-surface mb-1">5</span>
</button>
<!-- Day 6 -->
<button class="bg-surface rounded-xl min-h-[100px] p-3 shadow-sm flex flex-col items-center justify-start btn-press hover:bg-surface-container transition-colors">
<span class="font-subheading text-subheading text-on-surface mb-1">6</span>
</button>
<!-- Day 7 -->
<button class="bg-surface rounded-xl min-h-[100px] p-3 shadow-sm flex flex-col items-center justify-start btn-press hover:bg-surface-container transition-colors">
<span class="font-subheading text-subheading text-on-surface mb-1">7</span>
</button>
<!-- Day 8 - Today (Outlined in Primary) -->
<button class="bg-surface rounded-xl min-h-[100px] p-3 shadow-sm flex flex-col items-center justify-start btn-press border-2 border-primary ring-2 ring-primary-fixed ring-offset-2 ring-offset-bg transition-colors">
<span class="font-subheading text-subheading text-primary font-bold mb-1">8</span>
<span class="bg-primary-container text-on-primary-container font-caption text-caption px-2 py-1 rounded-full w-full text-center truncate mt-auto">טיול</span>
</button>
<!-- Day 9 -->
<button class="bg-surface rounded-xl min-h-[100px] p-3 shadow-sm flex flex-col items-center justify-start btn-press hover:bg-surface-container transition-colors">
<span class="font-subheading text-subheading text-on-surface mb-1">9</span>
</button>
<!-- Day 10 -->
<button class="bg-surface rounded-xl min-h-[100px] p-3 shadow-sm flex flex-col items-center justify-start btn-press hover:bg-surface-container transition-colors">
<span class="font-subheading text-subheading text-on-surface mb-1">10</span>
</button>
<!-- Day 11 -->
<button class="bg-surface rounded-xl min-h-[100px] p-3 shadow-sm flex flex-col items-center justify-start btn-press hover:bg-surface-container transition-colors">
<span class="font-subheading text-subheading text-on-surface mb-1">11</span>
</button>
<!-- Day 12 -->
<button class="bg-surface rounded-xl min-h-[100px] p-3 shadow-sm flex flex-col items-center justify-start btn-press hover:bg-surface-container transition-colors">
<span class="font-subheading text-subheading text-on-surface mb-1">12</span>
</button>
<!-- Day 13 -->
<button class="bg-surface rounded-xl min-h-[100px] p-3 shadow-sm flex flex-col items-center justify-start btn-press hover:bg-surface-container transition-colors">
<span class="font-subheading text-subheading text-on-surface mb-1">13</span>
</button>
<!-- Day 14 -->
<button class="bg-surface rounded-xl min-h-[100px] p-3 shadow-sm flex flex-col items-center justify-start btn-press hover:bg-surface-container transition-colors">
<span class="font-subheading text-subheading text-on-surface mb-1">14</span>
</button>
<!-- Generate rest of days 15-31 statically for layout preview -->
<script>
                const grid = document.currentScript.parentNode;
                for (let i = 15; i <= 31; i++) {
                    const btn = document.createElement('button');
                    btn.className = 'bg-surface rounded-xl min-h-[100px] p-3 shadow-sm flex flex-col items-center justify-start btn-press hover:bg-surface-container transition-colors';
                    btn.innerHTML = `<span class="font-subheading text-subheading text-on-surface mb-1">${i}</span>`;
                    grid.appendChild(btn);
                }
                
                // Add empty cells to complete the 35 cell grid (5 rows x 7 cols)
                const emptyCellsNeeded = 35 - 31 - 1; // Total - days - start offset
                for(let i=1; i<=emptyCellsNeeded; i++) {
                     const div = document.createElement('div');
                     div.className = 'bg-surface-container-low rounded-xl min-h-[100px] p-3 opacity-50 flex flex-col items-center justify-start';
                     div.innerHTML = `<span class="font-body text-body text-text-muted">${i}</span>`;
                     grid.appendChild(div);
                }
            </script>
</div>
</main>
</body></html>
