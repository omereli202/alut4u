[project]
name = "alut4u-backend"
version = "0.0.0"
description = "AAC & Support Platform — Flask backend"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "gunicorn>=22.0",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "supabase>=2.6",
    "httpx>=0.27",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    "flask-limiter>=3.7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "RUF"]
ignore = [
    "PLR0913", # many args — acceptable for factory/config functions
    "PLC0415", # deliberate lazy imports of heavy SDKs (supabase) inside functions
    "PLR2004", # magic values in comparisons — noisy, low value
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error",
    # Werkzeug's static-file sender leaves the fd for the GC to close under the
    # test client; not a defect in our code.
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
]
