[project]
name = "omi4u-backend"
version = "0.0.0"
description = "AAC & Support Platform — Flask backend"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "gunicorn>=22.0",
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "supabase>=2.6",
    "httpx>=0.27",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
    "cryptography>=42.0",
    "python-dotenv>=1.0",
    "flask-limiter>=3.7",
    "pillow>=10.3",
    "sentry-sdk[flask]>=2.0",
    # Cosine ranking for symbol search over the in-memory library snapshot.
    # The fastText model that produces the vectors is a LOCAL build tool only
    # (see scripts/build_symbol_vectors.py) — it is deliberately NOT here.
    "numpy>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "respx>=0.21",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
# `packages = ["app"]` alone ships only *.py — the search vectors are data.
app = ["data/symbol_vectors/*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["."]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL", "RUF"]
ignore = [
    "PLR0913", # many args — acceptable for factory/config functions
    "PLC0415", # deliberate lazy imports of heavy SDKs (supabase) inside functions
    "PLR2004", # magic values in comparisons — noisy, low value
    "RUF001",  # "ambiguous" Unicode — this is a Hebrew app, expected
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
filterwarnings = [
    "error",
    # Werkzeug's static-file sender leaves the fd for the GC to close under the
    # test client; not a defect in our code.
    "ignore::ResourceWarning",
    "ignore::pytest.PytestUnraisableExceptionWarning",
    # supabase-py / postgrest / gotrue internal deprecations we can't act on.
    "ignore:.*timeout.*parameter is deprecated.*:DeprecationWarning",
    "ignore:.*Python versions below.*:DeprecationWarning",
    "ignore::DeprecationWarning:postgrest.*",
    "ignore::DeprecationWarning:gotrue.*",
    "ignore::DeprecationWarning:supabase.*",
    "ignore::DeprecationWarning:httpx.*",
]
