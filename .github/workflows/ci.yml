name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "backend[dev]"
      - run: ruff check backend
      - run: ruff format --check backend

  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e "backend[dev]"

      - uses: supabase/setup-cli@v1
        with:
          version: "2.110.0"

      - name: Start Supabase + apply migrations
        run: |
          supabase start -x studio,imgproxy,vector,edge-runtime,logflare,realtime
          supabase migration up --local

      - name: Assert every public table has RLS enabled
        env:
          PGURL: postgresql://postgres:postgres@127.0.0.1:54322/postgres
        run: |
          bad=$(psql "$PGURL" -tAc "
            select string_agg(c.relname, ', ')
            from pg_class c join pg_namespace n on n.oid = c.relnamespace
            where n.nspname = 'public' and c.relkind = 'r' and c.relrowsecurity = false;")
          if [ -n "$bad" ]; then echo "tables without RLS: $bad"; exit 1; fi
          echo "all public tables have RLS enabled"

      - name: Test
        run: pytest backend
        env:
          APP_ENV: test

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Static checks
        run: |
          # No build step. Sanity-check every module parses.
          find frontend -name '*.js' -print0 | xargs -0 -n1 node --check
          python3 -c "import json,sys; json.load(open('frontend/manifest.webmanifest'))"
      - name: Validate Caddyfile
        run: docker run --rm -v "$PWD/frontend:/w" -w /w caddy:2-alpine caddy validate --config Caddyfile --adapter caddyfile

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build both images
        run: |
          docker build -t alut4u-backend ./backend
          docker build -t alut4u-frontend ./frontend
      - name: Smoke test the split topology
        run: |
          docker network create n
          docker run -d --rm --network n --name be -e PORT=8080 alut4u-backend
          docker run -d --rm --network n -p 8000:8080 \
            -e PORT=8080 -e BACKEND_ORIGIN=http://be:8080 alut4u-frontend
          for i in $(seq 1 20); do
            curl -sf http://localhost:8000/api/health && break || sleep 2
          done
          curl -sf http://localhost:8000/api/health | grep -q '"status":"ok"'
          curl -sf -o /dev/null http://localhost:8000/
          curl -sf -o /dev/null http://localhost:8000/manifest.webmanifest
