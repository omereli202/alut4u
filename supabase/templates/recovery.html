<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width" />
  </head>
  <body
    style="margin:0;padding:24px;background:#f6f7f9;font-family:Rubik,Arial,sans-serif;color:#1b1b1f;direction:rtl;text-align:right"
  >
    <table
      role="presentation"
      width="100%"
      cellpadding="0"
      cellspacing="0"
      style="max-width:480px;margin:0 auto;background:#ffffff;border-radius:12px;padding:24px"
    >
      <tr>
        <td>
          <h1 style="font-size:20px;margin:0 0 8px">איפוס סיסמה ב-omi4u</h1>
          <p style="margin:0 0 16px;line-height:1.6">
            התקבלה בקשה לאיפוס הסיסמה של החשבון {{ .Email }}. הזינו את הקוד הבא באפליקציה:
          </p>
          <p
            dir="ltr"
            style="margin:0 0 16px;font-size:32px;font-weight:700;letter-spacing:8px;text-align:center;background:#f1f3f5;border-radius:8px;padding:16px"
          >
            {{ .Token }}
          </p>
          <p style="margin:0 0 8px;line-height:1.6">הקוד תקף ל-10 דקות וניתן לשימוש פעם אחת.</p>
          <p style="margin:0;color:#5c5f66;line-height:1.6">
            אם לא ביקשתם לאפס סיסמה — אפשר להתעלם מהמייל הזה, הסיסמה שלכם לא השתנתה.
          </p>
        </td>
      </tr>
    </table>
  </body>
</html>
